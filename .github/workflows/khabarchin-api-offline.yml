name: Khabarchin Control API offline security tests

on:
  pull_request:
    paths:
      - 'ops/khabarchin_control_api.py'
      - 'ops/khabarchin_status_probe.py'
      - 'tests/test_khabarchin_control_api.py'
      - 'ops/openapi-khabarchin-control-v1.json'
      - '.github/workflows/khabarchin-api-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-api-tests:
    # Never run untrusted PR code on the owner's permanent self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Compile standalone API and owner probe
        run: python -m py_compile ops/khabarchin_control_api.py ops/khabarchin_status_probe.py
      - name: Validate OpenAPI JSON
        run: python -m json.tool ops/openapi-khabarchin-control-v1.json > /dev/null
      - name: Test isolated fake SQLite and request authentication
        run: python -m unittest discover -s tests -p test_khabarchin_control_api.py -v
