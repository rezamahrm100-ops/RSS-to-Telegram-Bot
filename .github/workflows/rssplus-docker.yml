name: RSSPlus VPS image build
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/rssplus-docker.yml'
  push:
    branches:
      - feature/rssplus-vps
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for VPS architecture without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: rssplus:ci
